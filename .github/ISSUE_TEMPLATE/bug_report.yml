name: Bug report
description: Create a report to help improve existing features
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched [open FinanceReader issues](https://github.com/freminet-pers/FinanceReader/issues?q=is%3Aissue+is%3Aopen) for duplicates.
          required: true
        - label: I have also searched [closed FinanceReader issues](https://github.com/freminet-pers/FinanceReader/issues?q=is%3Aissue+is%3Aclosed) for an existing fix or explanation.
          required: true
        - label: I will describe the problem with reproducible steps and remove API keys or private article text from logs.
          required: true
        - label: If the bug only occurs with a certain feed, I will include its public URL when it is safe to share.
          required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: The latest version can be different on different app stores.
      placeholder: x.y.z
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where did you get the app from
      multiple: false
      options:
        - GitHub Release APK
        - Built from source
        - Other
    validations:
      required: true
  - type: dropdown
    id: full_article
    attributes:
      label: Are you using the "Parse full article" feature?
      multiple: false
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: input
    id: android_version
    attributes:
      label: Android version
      description: Please mention if you are using a custom rom!
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model
  - type: input
    id: first
    attributes:
      label: First occurred
      placeholder: about x days/weeks ago
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. This
        2. Then that
        3. Then this
        4. Etc.
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: After following the steps, what did you expect FinanceReader to do?
  - type: textarea
    id: current
    attributes:
      label: Current behaviour
      description: What did FinanceReader do instead? Real screenshots can help, but do not include API keys or private article text.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: If you are experiencing a crash, including the stacktrace might help. Leave this blank if you don't know how to find it.

