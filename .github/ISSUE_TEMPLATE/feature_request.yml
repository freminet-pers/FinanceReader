name: Feature request
description: Request a new feature or enhancement
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched [open FinanceReader issues](https://github.com/freminet-pers/FinanceReader/issues?q=is%3Aissue+is%3Aopen) for duplicates.
          required: true
        - label: I have also searched [closed FinanceReader issues](https://github.com/freminet-pers/FinanceReader/issues?q=is%3Aissue+is%3Aclosed) for an existing implementation or explanation.
          required: true
        - label: I will describe the problem and use case with enough detail to evaluate it.
          required: true
        - label: This request contains one focused feature or improvement, not a bundle of unrelated requests.
          required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: The latest version can differ by installation source.
      placeholder: x.y.z
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where did you get the app from
      multiple: false
      options:
        - GitHub Release APK
        - Built from source
        - Other
    validations:
      required: true
  - type: textarea
    id: feature
    attributes:
      label: Feature or improvement you want
      description: Explain the behavior and the user path as specifically as possible.
  - type: textarea
    id: reason
    attributes:
      label: Why should this be added?
      description: What problem does the feature solve? In what use-cases is the feature needed?
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Drawings / Technical details
      description: If your request is about (or includes) changing or extending the UI, describe what the UI would look like and how the user would interact with it.

